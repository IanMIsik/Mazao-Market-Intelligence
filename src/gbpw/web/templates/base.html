<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mazao Energy Data Analytics{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
{% block extra_head %}{% endblock %}
</head>
<body class="{{ 'live' if active_nav in ('live', 'forecasts') else '' }}" data-last-updated="{{ last_updated|default('') }}">

<div class="appnav">
  <div class="wrap">
    <div class="brand">Mazao Consulting <span>/ Energy Data Analytics</span></div>
    <nav>
      <a href="/gbpw" class="{{ 'on' if active_nav == 'gbpw' else '' }}">GB Power Weekly</a>
      <a href="/bess" class="{{ 'on' if active_nav == 'bess' else '' }}">BESS Analytics</a>
      <a href="/live" class="{{ 'on' if active_nav == 'live' else '' }}">Live market</a>
      <a href="/forecasts" class="{{ 'on' if active_nav == 'forecasts' else '' }}">Forecasts</a>
      <a href="/ppa" class="{{ 'on' if active_nav == 'ppa' else '' }}">PPA tools</a>
    </nav>
  </div>
</div>

<div class="wrap">
{% block content %}{% endblock %}
</div>

{% block extra_body %}{% endblock %}
<script>
(function () {
  // charts_live.py's progression_svg/comparison_svg/triple_comparison_svg/
  // dual_series_svg (Live Market's Fundamentals/Interconnectors/Generation
  // tabs, Forecasts' single-day views) put each point's reading in a
  // native SVG <title>, shown only via the browser's own hover tooltip --
  // confirmed live, that's genuinely inert on a touchscreen (no hover
  // state, no standard touch equivalent), which is why these charts
  // render but have no way to read an exact value on mobile. No new
  // touch-specific wiring needed to fix it: a tap already fires a normal
  // synthesized `click` in every mobile browser, so this reuses that to
  // show the same <title> text in a small custom tooltip instead.
  // Unconditional here (not per-page) since this same pattern is shared
  // across both pages above -- a no-op wherever no .chart-hit exists.
  var hits = document.querySelectorAll('.chart-hit');
  if (!hits.length) return;

  var tip = document.createElement('div');
  tip.className = 'chart-tap-tooltip';
  document.body.appendChild(tip);

  hits.forEach(function (hit) {
    var titleEl = hit.querySelector('title');
    if (!titleEl) return;
    hit.addEventListener('click', function (e) {
      e.stopPropagation();
      tip.textContent = titleEl.textContent;
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY - 12) + 'px';
      tip.style.display = 'block';
    });
  });
  document.addEventListener('click', function () { tip.style.display = 'none'; });
  document.addEventListener('scroll', function () { tip.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
