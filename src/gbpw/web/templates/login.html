<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | Mazao Consulting</title>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body class="auth-page">

<div class="appnav">
  <div class="wrap">
    <div class="brand">Mazao Consulting <span>/ Energy Data Analytics</span></div>
  </div>
</div>

<main class="auth-card">
  <h1>Sign in</h1>
  <p class="byline">Sign in to open the Portfolio Risk KPI tool. The market pages stay open to everyone.</p>

  {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required {% if not email %}autofocus{% endif %}>
    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" name="password" type="password" autocomplete="current-password" required {% if email %}autofocus{% endif %}>
      <button type="button" class="pw-toggle" aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <button class="btn auth-submit" type="submit">Sign in</button>
  </form>

  <p class="auth-note">Accounts are created by Mazao Consulting. Need access or a password reset? Contact your Mazao representative.</p>
</main>

<script>
(function () {
  var btn = document.querySelector('.pw-toggle'), input = document.getElementById('password');
  btn.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
