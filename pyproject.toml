[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbpw"
version = "0.1.0"
description = "GB Power Weekly recap page generator (Mazao Consulting)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "jinja2>=3.1",
    "tzdata>=2024.1",
    "anthropic>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "entsoe-py>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gbpw = "gbpw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
