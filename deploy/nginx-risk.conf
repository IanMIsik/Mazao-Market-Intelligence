# Nginx rules that put the Portfolio Risk KPI tool (/risk/) behind the site's sign-in page.
# Installed by deploy/enable-risk.sh into the existing server block (works with or without
# certbot's HTTPS additions). Everything else on the site stays public.
#
# How it works: for every request under /risk/, Nginx first asks the Mazao app
# (GET /auth/check, see src/gbpw/web/auth.py). 204 = signed in, so the request goes on to the KPI
# container; 401 = not signed in, so the browser is sent to /login?next=... and comes back after
# signing in.

location = /auth/check {
    internal;
    proxy_pass http://127.0.0.1:5000/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /risk {
    absolute_redirect off;
    return 301 /risk/;
}

location /risk/ {
    auth_request /auth/check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    error_page 401 = @risk_login;

    # The trailing slash strips the /risk/ prefix, so the KPI app sees /api/... and /assets/...
    proxy_pass http://127.0.0.1:8020/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Auth-User $auth_user;
    client_max_body_size 10m;   # client Excel uploads
}

location @risk_login {
    absolute_redirect off;   # relative redirect: correct behind any port or proxy
    return 302 /login?next=$request_uri;
}
