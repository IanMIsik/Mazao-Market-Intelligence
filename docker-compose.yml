# Local/single-host convenience wrapper around `docker build` + `docker run`
# -- bind-mounts ./data and ./out from the host rather than named volumes,
# so the same SQLite file you'd get from running this app directly (see
# README) is what the container reads/writes, and it survives
# `docker compose down`/image rebuilds without any extra steps.
#
# ANTHROPIC_API_KEY/ENTSOE_KEY here are read from the *shell environment*
# or an optional .env file next to this one (Compose's own variable-
# substitution mechanism) -- that .env is Compose's, not the app's; the
# app itself still only ever reads plain process environment variables
# (see README's "no .env mechanism in this project" note), Compose is
# just what's putting them there in this setup.
services:
  gbpw:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENTSOE_KEY=${ENTSOE_KEY:-}
      # Always-admin accounts (comma-separated emails): /admin/users access even if the database flag is lost.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Alert emails (web/alerts.py): set these in the .env file next to this one. Unset = no emails.
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped

  # Portfolio Risk KPI, served at /risk/ behind the sign-in page (see deploy/enable-risk.sh and
  # deploy/nginx-risk.conf). Only starts with `--profile risk`, so a plain `docker compose up`
  # is unchanged. Bound to localhost: Nginx is the only way in, after the sign-in check.
  risk:
    profiles: ["risk"]
    build: ${RISK_APP_DIR:-../risk-kpi}
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - ./risk-data:/data
    restart: unless-stopped
